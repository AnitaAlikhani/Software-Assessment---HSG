name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_artifact_name: github-pages-${{ github.run_attempt }}
    steps:
      - name: Check out main app
        uses: actions/checkout@v7
        with:
          ref: main
          path: main-app
          persist-credentials: false

      - name: Check out Figma sync preview
        uses: actions/checkout@v7
        with:
          ref: nil-figma-sync
          path: preview-app
          persist-credentials: false

      - name: Check out Anita banner preview
        uses: actions/checkout@v7
        with:
          ref: anita-banner
          path: anita-app
          persist-credentials: false

      - name: Check out Anita fixes preview
        uses: actions/checkout@v7
        with:
          ref: anita-fixes
          path: fixes-app
          persist-credentials: false

      - name: Check out Anita first visit navigation preview
        uses: actions/checkout@v7
        with:
          ref: anita-fix-first-visit-navigation
          path: first-visit-app
          persist-credentials: false

      - name: Check out Anita customer booking preview
        uses: actions/checkout@v7
        with:
          ref: anita-fix-customer-booking
          path: customer-booking-app
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install main dependencies
        working-directory: main-app
        run: npm install --no-audit --no-fund

      - name: Build main app
        working-directory: main-app
        run: npm run build -- --base=/Software-Assessment---HSG/

      - name: Install preview dependencies
        working-directory: preview-app
        run: npm install --no-audit --no-fund

      - name: Build Figma sync preview
        working-directory: preview-app
        run: npm run build -- --base=/Software-Assessment---HSG/previews/nil-figma-sync/

      - name: Install Anita preview dependencies
        working-directory: anita-app
        run: npm install --no-audit --no-fund

      - name: Check Anita preview types
        working-directory: anita-app
        run: npm run lint

      - name: Build Anita banner preview
        working-directory: anita-app
        run: npm run build -- --base=/Software-Assessment---HSG/previews/anita-banner/

      - name: Install Anita fixes dependencies
        working-directory: fixes-app
        run: npm install --no-audit --no-fund

      - name: Check Anita fixes types
        working-directory: fixes-app
        run: npm run lint

      - name: Build Anita fixes preview
        working-directory: fixes-app
        run: npm run build -- --base=/Software-Assessment---HSG/previews/anita-fixes/

      - name: Install first visit navigation dependencies
        working-directory: first-visit-app
        run: npm install --no-audit --no-fund

      - name: Check first visit navigation types
        working-directory: first-visit-app
        run: npm run lint

      - name: Test first visit navigation
        working-directory: first-visit-app
        run: npm test

      - name: Build first visit navigation preview
        working-directory: first-visit-app
        run: npm run build -- --base=/Software-Assessment---HSG/previews/anita-fix-first-visit-navigation/

      - name: Install customer booking dependencies
        working-directory: customer-booking-app
        run: npm install --no-audit --no-fund

      - name: Check customer booking types
        working-directory: customer-booking-app
        run: npm run lint

      - name: Test customer booking
        working-directory: customer-booking-app
        run: npm test

      - name: Build customer booking preview
        working-directory: customer-booking-app
        run: npm run build -- --base=/Software-Assessment---HSG/previews/anita-fix-customer-booking/

      - name: Assemble main site and branch previews
        run: |
          mkdir -p site/previews/nil-figma-sync site/previews/anita-banner site/previews/anita-fixes site/previews/anita-fix-first-visit-navigation
          cp -a main-app/dist/. site/
          cp -a preview-app/dist/. site/previews/nil-figma-sync/
          git -C preview-app rev-parse HEAD > site/previews/nil-figma-sync/revision.txt
          cp -a anita-app/dist/. site/previews/anita-banner/
          git -C anita-app rev-parse HEAD > site/previews/anita-banner/revision.txt
          cp -a fixes-app/dist/. site/previews/anita-fixes/
          git -C fixes-app rev-parse HEAD > site/previews/anita-fixes/revision.txt
          cp -a first-visit-app/dist/. site/previews/anita-fix-first-visit-navigation/
          git -C first-visit-app rev-parse HEAD > site/previews/anita-fix-first-visit-navigation/revision.txt

          mkdir -p site/previews/anita-fix-customer-booking
          cp -a customer-booking-app/dist/. site/previews/anita-fix-customer-booking/
          git -C customer-booking-app rev-parse HEAD > site/previews/anita-fix-customer-booking/revision.txt

      - name: Upload combined site
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_attempt }}
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Deploy main site and branch previews
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ needs.build.outputs.pages_artifact_name }}
