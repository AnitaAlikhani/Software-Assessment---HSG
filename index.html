<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- The app sets the title of each screen once it runs (src/pageHead.ts). This one is for link previews and search results. -->
    <title>SlotBee – AI receptionist and booking manager for salons</title>
    <meta name="description" content="AI receptionist and booking manager for salons. SlotBee answers customer messages, takes booking requests and keeps calendar, team and customers in one place." />
    <meta name="application-name" content="SlotBee" />
    <meta name="apple-mobile-web-app-title" content="SlotBee" />
    <meta name="theme-color" content="#5551FF" />
    <!-- Requests of the app name only this site as their origin, never the page's address: an owner link
         ("?live=…") or a chat link ("?chat=…") must not travel to anyone in a Referer header. -->
    <meta name="referrer" content="origin" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Chat apps and social networks need the full address of the picture; they do not resolve a relative one.
         There is no og:url on purpose: this one file also serves a salon's booking page and chat, and a fixed
         address would make a shared booking link open the owner's app on networks that follow og:url. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SlotBee" />
    <meta property="og:title" content="SlotBee – AI receptionist and booking manager for salons" />
    <meta property="og:description" content="AI receptionist and booking manager for salons. SlotBee answers customer messages, takes booking requests and keeps calendar, team and customers in one place." />
    <meta property="og:image" content="https://slotbee.vercel.app/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="SlotBee: AI receptionist and booking manager for salons" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://slotbee.vercel.app/og-image.png" />
    <!-- The typeface comes from this site (public/fonts). Fetching it early avoids a flash of the fallback font. -->
    <link rel="preload" href="/fonts/plus-jakarta-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body class="bg-[#F8F9FD] text-slate-800 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
